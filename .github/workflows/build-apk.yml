name: APK Derle

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # app/release.keystore projeye dahil, sabit sifreyle build.gradle'da
      # tanimli - hem debug hem release APK otomatik ve KALICI ayni anahtarla imzalanir.
      - name: Debug APK derle
        run: gradle assembleDebug --no-daemon

      - name: Release APK derle (imzali)
        run: gradle assembleRelease --no-daemon

      - name: Debug APK'yi yukle
        uses: actions/upload-artifact@v4
        with:
          name: stok-takip-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Release APK'yi yukle
        uses: actions/upload-artifact@v4
        with:
          name: stok-takip-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: GitHub Release olustur (sadece v* etiketinde)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
